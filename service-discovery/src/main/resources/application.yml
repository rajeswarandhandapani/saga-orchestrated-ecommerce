spring:
  application:
    name: service-discovery
server:
  port: 9761
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:9761/eureka/
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
