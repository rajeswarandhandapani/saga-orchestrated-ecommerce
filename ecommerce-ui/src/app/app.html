<header class="topbar">
  <a class="brand" routerLink="/">saga<span>shop</span></a>
  <nav aria-label="Main">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Shop</a>
    <a routerLink="/cart" routerLinkActive="active">
      Cart
      @if (cart.count()) {
        <span class="pill">{{ cart.count() }}</span>
      }
    </a>
    @if (auth.isAuthenticated()) {
      <a routerLink="/orders" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">My orders</a>
    }
    @if (auth.isAdmin()) {
      <span class="divider" aria-hidden="true"></span>
      <a routerLink="/admin/sagas" routerLinkActive="active">Sagas</a>
      <a routerLink="/admin/stock" routerLinkActive="active">Stock</a>
      <a routerLink="/admin/orders" routerLinkActive="active">All orders</a>
    }
  </nav>
  <div class="who">
    @if (auth.isAuthenticated()) {
      <span class="muted small">{{ auth.name() }}</span>
      <button class="btn ghost small" (click)="auth.logout()">Sign out</button>
    } @else {
      <button class="btn small" (click)="auth.login()">Sign in</button>
    }
  </div>
</header>
<main class="container">
  <router-outlet />
</main>
